name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          combine: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT
          path: ${{ github.workspace }}/build/*.geode
